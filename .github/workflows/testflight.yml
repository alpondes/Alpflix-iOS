# TestFlight: main'e her push'ta (ya da elle) Xcode 26 ile derlenir ve App Store Connect'e yüklenir.
# İmza: dağıtım sertifikası ve App Store profili App Store Connect API anahtarıyla kendiliğinden oluşturulur /
# alınır (codemagic-cli-tools, açık kaynak; Codemagic hesabı gerekmez). Sertifikanın özel anahtarı her seferinde
# yeni sertifika açılmasın diye depoda şifreli durur (Config/signing/dist-key.enc; şifre API anahtarından türetilir,
# fastlane match yöntemi). Profil/sertifika elle gerekmez.
# Gerekli secret'lar: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, TMDB_API_TOKEN (KURULUM.md).
name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      TEAM_ID: 8BDS9V8X77
    steps:
      - name: Anahtarlar var mı
        id: keys
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 secret'ları eksik; TestFlight yüklemesi atlandı."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.keys.outputs.ok == 'true'

      - name: Anahtar dosyası ve TMDB
        if: steps.keys.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # .p8 içeriği nasıl yapıştırılmış olursa olsun düzeltilir (içerik günlüğe yazılmaz):
          # tam dosya, satır sonları "\n" olarak, yalnız ortadaki gövde ya da dosyanın base64'ü.
          RAW=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed 's/\\n/\n/g')
          if printf '%s' "$RAW" | grep -q "BEGIN PRIVATE KEY"; then
            BODY=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          else
            BODY=$(printf '%s' "$RAW" | tr -d ' \n\t')
            DECODED=$(printf '%s' "$BODY" | base64 -d 2>/dev/null || true)
            if printf '%s' "$DECODED" | grep -q "BEGIN PRIVATE KEY"; then
              BODY=$(printf '%s' "$DECODED" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
            fi
          fi
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } | sed '/^$/d' > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 geçerli bir .p8 anahtarı değil (uzunluk: ${#BODY} karakter; beklenen ~200). Secret'a AuthKey_${ASC_KEY_ID}.p8 dosyasının içeriğini yapıştır."
            exit 1
          fi
          echo "Anahtar dosyası geçerli."
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"
          if [ -n "$TMDB_API_TOKEN" ]; then
            printf 'enum BuildSecrets {\n    static let tmdbToken = "%s"\n}\n' "$TMDB_API_TOKEN" > Alpflix/Core/BuildSecrets.swift
          else
            echo "::warning::TMDB_API_TOKEN yok; anahtar uygulamada Ayarlar'dan girilecek."
          fi

      - name: Proje ve CocoaPods
        if: steps.keys.outputs.ok == 'true'
        run: |
          brew install xcodegen || true
          xcodegen generate
          pod install --repo-update

      - name: İmza araçları ve sertifika anahtarı
        if: steps.keys.outputs.ok == 'true'
        run: |
          xcodebuild -version
          pip3 install --break-system-packages --quiet codemagic-cli-tools || pip3 install --quiet codemagic-cli-tools
          PASS=$(shasum -a 256 "$KEY_PATH" | cut -d' ' -f1)
          CERT_KEY="$RUNNER_TEMP/keys/dist.key"
          if [ -f Config/signing/dist-key.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in Config/signing/dist-key.enc -out "$CERT_KEY" -pass "pass:$PASS" 2>/dev/null || rm -f "$CERT_KEY"
          fi
          if [ ! -s "$CERT_KEY" ]; then
            ssh-keygen -t rsa -b 2048 -m PEM -f "$CERT_KEY" -q -N ""
            echo "NEW_CERT_KEY=1" >> "$GITHUB_ENV"
            echo "Yeni sertifika anahtarı oluşturuldu."
          fi
          echo "CERT_KEY=$CERT_KEY" >> "$GITHUB_ENV"
          echo "CERT_PASS=$PASS" >> "$GITHUB_ENV"
          echo "::add-mask::$PASS"

      - name: Sertifika ve profil (App Store)
        if: steps.keys.outputs.ok == 'true'
        run: |
          export APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$ASC_KEY_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$KEY_PATH")"
          export CERTIFICATE_PRIVATE_KEY="$(cat "$CERT_KEY")"
          keychain initialize
          app-store-connect fetch-signing-files "com.alpflix.ios" --platform IOS --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Sertifika anahtarını şifreli sakla
        if: steps.keys.outputs.ok == 'true' && env.NEW_CERT_KEY == '1'
        run: |
          mkdir -p Config/signing
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$CERT_KEY" -out Config/signing/dist-key.enc -pass "pass:$CERT_PASS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Config/signing/dist-key.enc
          git commit -m "İmza: dağıtım sertifikası anahtarı (şifreli)"
          git push

      - name: Derle (Xcode 26, imzalı IPA)
        if: steps.keys.outputs.ok == 'true'
        run: |
          agvtool new-version -all $((GITHUB_RUN_NUMBER + 100))
          xcode-project build-ipa --workspace Alpflix.xcworkspace --scheme Alpflix

      - name: TestFlight'a yükle
        if: steps.keys.outputs.ok == 'true'
        run: |
          export APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$ASC_KEY_ID"
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$KEY_PATH")"
          app-store-connect publish --path build/ios/ipa/*.ipa

      - name: Anahtar dosyasını sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
