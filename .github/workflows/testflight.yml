# TestFlight: main'e her push'ta (ya da elle) Mac'te arşivlenir, Apple'ın bulut imzalamasıyla
# (App Store Connect API anahtarı) imzalanıp App Store Connect'e yüklenir. Profil/sertifika elle gerekmez.
# Gerekli secret'lar: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, TMDB_API_TOKEN (KURULUM.md).
name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      TEAM_ID: 8BDS9V8X77
    steps:
      - name: Anahtarlar var mı
        id: keys
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 secret'ları eksik; TestFlight yüklemesi atlandı."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.keys.outputs.ok == 'true'

      - name: Anahtar dosyası ve TMDB
        if: steps.keys.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # .p8 içeriği nasıl yapıştırılmış olursa olsun düzeltilir (içerik günlüğe yazılmaz):
          # tam dosya, satır sonları "\n" olarak, yalnız ortadaki gövde ya da dosyanın base64'ü.
          RAW=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed 's/\\n/\n/g')
          if printf '%s' "$RAW" | grep -q "BEGIN PRIVATE KEY"; then
            BODY=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          else
            BODY=$(printf '%s' "$RAW" | tr -d ' \n\t')
            DECODED=$(printf '%s' "$BODY" | base64 -d 2>/dev/null || true)
            if printf '%s' "$DECODED" | grep -q "BEGIN PRIVATE KEY"; then
              BODY=$(printf '%s' "$DECODED" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
            fi
          fi
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } | sed '/^$/d' > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 geçerli bir .p8 anahtarı değil (uzunluk: ${#BODY} karakter; beklenen ~200). Secret'a AuthKey_${ASC_KEY_ID}.p8 dosyasının içeriğini yapıştır."
            exit 1
          fi
          echo "Anahtar dosyası geçerli."
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"
          if [ -n "$TMDB_API_TOKEN" ]; then
            printf 'enum BuildSecrets {\n    static let tmdbToken = "%s"\n}\n' "$TMDB_API_TOKEN" > Alpflix/Core/BuildSecrets.swift
          else
            echo "::warning::TMDB_API_TOKEN yok; anahtar uygulamada Ayarlar'dan girilecek."
          fi

      - name: Proje ve CocoaPods
        if: steps.keys.outputs.ok == 'true'
        run: |
          brew install xcodegen || true
          xcodegen generate
          pod install --repo-update

      - name: Arşivle (imzasız; imza dışa aktarımda)
        if: steps.keys.outputs.ok == 'true'
        run: |
          set -o pipefail
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          xcodebuild -workspace Alpflix.xcworkspace -scheme Alpflix -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Alpflix.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: İmzala ve TestFlight'a yükle
        if: steps.keys.outputs.ok == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/Alpflix.xcarchive \
            -exportOptionsPlist Config/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -vE "^\s*$" | tail -60
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log

      - name: Anahtar dosyasını sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
