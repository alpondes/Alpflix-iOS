# XcodeGen tanımı: Xcode projesi depoda tutulmaz, Codemagic'te `xcodegen generate` ile üretilir.
name: Alpflix
options:
  bundleIdPrefix: com.alpflix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    ENABLE_BITCODE: NO
targets:
  Alpflix:
    type: application
    platform: iOS
    sources:
      - path: Alpflix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpflix.ios
        PRODUCT_NAME: Alpflix
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
